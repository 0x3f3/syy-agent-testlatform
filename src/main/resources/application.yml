spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: syy-agent-test-platform
  datasource:
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:syy_agent_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing installations are baselined at version 0; V1/V2/V3 then upgrade the schema incrementally.
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:1500ms}
  jpa:
    hibernate:
      # Flyway is the only schema manager; Hibernate must not mutate production tables.
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-max}
        api-key: ${DASHSCOPE_API_KEY}
      streaming-chat-model:
        model-name: ${DASHSCOPE_STREAMING_MODEL:qwen-max}
        api-key: ${DASHSCOPE_API_KEY}
      embedding-model:
        model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
        api-key: ${DASHSCOPE_API_KEY}
bigmodel:
  api-key: ${BIGMODEL_API_KEY:}
app:
  rag:
    hybrid:
      enabled: ${RAG_HYBRID_ENABLED:true}
      vector-candidate-multiplier: ${RAG_VECTOR_CANDIDATE_MULTIPLIER:3}
      bm25-candidate-multiplier: ${RAG_BM25_CANDIDATE_MULTIPLIER:3}
      rrf-constant: ${RAG_RRF_CONSTANT:60}
  redis:
    cache-enabled: ${REDIS_CACHE_ENABLED:true}
    document-ttl: ${REDIS_DOCUMENT_TTL:30m}
    rag-ttl: ${REDIS_RAG_TTL:10m}
    task-status-ttl: ${REDIS_TASK_STATUS_TTL:24h}
  execution:
    task-core-pool-size: ${TASK_CORE_POOL_SIZE:2}
    task-max-pool-size: ${TASK_MAX_POOL_SIZE:4}
    task-queue-capacity: ${TASK_QUEUE_CAPACITY:100}
    http-core-pool-size: ${HTTP_CORE_POOL_SIZE:8}
    http-max-pool-size: ${HTTP_MAX_POOL_SIZE:16}
    http-queue-capacity: ${HTTP_QUEUE_CAPACITY:500}
    per-task-concurrency: ${PER_TASK_CONCURRENCY:4}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:15000}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    poll-interval-ms: ${SCHEDULER_POLL_INTERVAL_MS:15000}
    zone: ${SCHEDULER_ZONE:Asia/Shanghai}
  mcp:
    enabled: ${MCP_ENABLED:false}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
  # Local demo API fixture for end-to-end testing of the included sample OpenAPI document.
  demo-api:
    enabled: ${DEMO_API_ENABLED:false}
demo:
  shop:
    username: ${DEMO_SHOP_USERNAME}
    password: ${DEMO_SHOP_PASSWORD}
    token: ${DEMO_SHOP_TOKEN}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    try-it-out-enabled: true
    persist-authorization: true
  packages-to-scan:
    - com.syy.aicodehelper.controller
    - com.syy.aicodehelper.demo
